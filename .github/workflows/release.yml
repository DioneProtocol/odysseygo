name: Release Odysseygo with version

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  build-odysseygo:
    name: Build Odysseygo binary
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-deps

      - uses: ./.github/actions/setup-go

      - name: Get tag from git
        id: get_tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${TAG}"
        shell: bash

      - name: Build Binary
        run: |
          ./scripts/build.sh
        shell: bash

      - name: Create directory and move binary
        run: |
          mkdir -p build/odysseygo-${{ env.TAG }}
          mv build/odysseygo build/odysseygo-${{ env.TAG }}/odysseygo
        shell: bash

      - name: Archive binary in Targz
        run: |
          cd build
          tar -czvf ../odysseygo-linux-amd64-${{ env.TAG }}.tar.gz odysseygo-${{ env.TAG }}
        shell: bash

      - name: Upload artifact with odysseygo
        uses: actions/upload-artifact@v4
        with:
          name: odysseygo-linux-amd64-${{ env.TAG }}
          path: odysseygo-linux-amd64-${{ env.TAG }}.tar.gz
          retention-days: 30

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          release_name: Release ${{ env.TAG }}
          draft: false
          prerelease: false
          allowUpdates: true

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./odysseygo-linux-amd64-${{ env.TAG }}.tar.gz
          asset_name: odysseygo-linux-amd64-${{ env.TAG }}.tar.gz
          asset_content_type: application/x-tar

  trigger-installer-build:
    name: Trigger Installer Build
    needs: build-odysseygo
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && secrets.INSTALLER_REPO_TOKEN != ''
    steps:
      - name: Get tag
        id: get_tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${TAG}"

      - name: Trigger installer workflow
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.INSTALLER_REPO_TOKEN }}
          repository: DioneProtocol/odysseygo-installer
          event-type: odysseygo-release
          client-payload: |
            {
              "version": "${{ steps.get_tag.outputs.tag }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}"
            }
